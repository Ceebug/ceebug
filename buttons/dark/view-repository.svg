<svg xmlns="http://www.w3.org/2000/svg" width="150" height="36" viewBox="0 0 150 36">
  <style>
    .background {
      fill: #21262d;
      stroke: #30363d;
      transition: fill .15s, stroke .15s;
    }

    text {
      fill: #c9d1d9;
      font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: fill .15s;
    }

    .icon {
      fill: none;
      stroke: #c9d1d9;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .15s;
    }

    svg:hover .background {
      fill: #30363d;
      stroke: #8b949e;
    }

    svg:hover text {
      fill: #ffffff;
    }

    svg:hover .icon {
      stroke: #ffffff;
    }
    .background {
    fill: #21262d;
    stroke: #30363d;
    }
  </style>

  <rect class="background" x=".75" y=".75" width="148.5" height="34.5" rx="6" stroke-width="1.5"/>

  <g transform="translate(18.5 0)">
    <g class="icon">
      <rect x="0" y="10" width="17" height="17" rx="2"/>
      <path d="M4 14h9M4 18h9M4 22h5"/>
    </g>

    <text x="23" y="22">View repository</text>
  </g>
</svg>
