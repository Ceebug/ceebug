<svg xmlns="http://www.w3.org/2000/svg" width="160" height="40" viewBox="0 0 160 40">
  <style>
    .background {
      fill: #171d24;
      stroke: #30363d;
      stroke-width: 1;
      transition: fill .15s, stroke .15s;
    }

    text {
      fill: #e6edf3;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      transition: fill .15s;
    }

    .icon {
      fill: none;
      stroke: #e6edf3;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .15s;
    }

    svg:hover .background {
      fill: #30363d;
      stroke: #8b949e;
    }

    svg:hover text,
    svg:hover .icon {
      stroke: #ffffff;
    }

    svg:hover text {
      fill: #ffffff;
    }
  </style>

  <rect class="background" x="1" y="1" width="158" height="38" rx="8"/>

  <svg x="27" y="8" width="24" height="24" viewBox="0 0 24 24">
    <g class="icon">
      <path d="M14 6h4v4"/>
      <path d="M18 6l-8 8"/>
      <path d="M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
    </g>
  </svg>

  <text x="58" y="25">View social</text>
</svg>
