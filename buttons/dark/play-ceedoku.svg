<svg xmlns="http://www.w3.org/2000/svg" width="135" height="36" viewBox="0 0 135 36">
  <style>
    rect {
      fill: #21262d;
      stroke: #30363d;
      transition: fill .15s, stroke .15s;
    }

    text {
      fill: #c9d1d9;
      font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: fill .15s;
    }

    .icon {
      fill: none;
      stroke: #c9d1d9;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .15s;
    }

    svg:hover rect {
      fill: #30363d;
      stroke: #8b949e;
    }

    svg:hover text { fill: #ffffff; }
    svg:hover .icon { stroke: #ffffff; }
  </style>

  <rect x=".75" y=".75" width="133.5" height="34.5" rx="8" stroke-width="1.5"/>

  <path class="icon" d="
    M19 12.5
    Q19 10.5 21 11.5
    L29.5 17
    Q31 18 29.5 19
    L21 24.5
    Q19 25.5 19 23.5
    Z
  "/>

  <text x="39" y="22" textLength="78" lengthAdjust="spacingAndGlyphs">Play Ceedoku</text>
</svg>
