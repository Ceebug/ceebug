<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="150" height="36" viewBox="0 0 150 36">
  <foreignObject x="0" y="0" width="150" height="36">
    <xhtml:div xmlns="http://www.w3.org/1999/xhtml" class="wrapper">
      <xhtml:style>
        * { box-sizing: border-box; }
        .wrapper { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
        button { appearance:none; -webkit-appearance:none; border:0; outline:0; box-shadow:none; width:100%; height:100%; margin:0; padding:0 14px; border-radius:6px; background:#21262d; color:#c9d1d9; display:inline-flex; align-items:center; justify-content:center; gap:9px; font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1; white-space:nowrap; cursor:pointer; transition:background-color .15s,color .15s; }
        button:hover { background:#30363d; color:#ffffff; }
        svg { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      </xhtml:style>
      <xhtml:button type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none"><circle cx="12" cy="12" r="8"/><path d="M12 11v5"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/></svg>
        <xhtml:span>Learn more</xhtml:span>
      </xhtml:button>
    </xhtml:div>
  </foreignObject>
</svg>