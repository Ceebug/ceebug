<svg xmlns="http://www.w3.org/2000/svg" width="150" height="36" viewBox="0 0 150 36">
  <style>
    rect {
      fill: #21262d;
      stroke: #30363d;
      transition: fill .15s, stroke .15s;
    }

    text {
      fill: #c9d1d9;
      font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: fill .15s;
    }

    .icon {
      fill: none;
      stroke: #c9d1d9;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .15s;
    }

    svg:hover rect {
      fill: #30363d;
      stroke: #8b949e;
    }

    svg:hover text {
      fill: #ffffff;
    }

    svg:hover .icon {
      stroke: #ffffff;
    }
  </style>

  <rect x=".75" y=".75" width="148.5" height="34.5" rx="6" stroke-width="1.5"/>

  <g class="icon">
    <circle cx="37" cy="18" r="8"/>
    <path d="M37 17v5M37 14h.01"/>
  </g>

  <text x="52" y="22">Learn more</text>
</svg>
