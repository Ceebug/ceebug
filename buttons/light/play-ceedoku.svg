<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="960" height="36" viewBox="0 0 960 36">
  <foreignObject x="0" y="0" width="960" height="36">
    <xhtml:div xmlns="http://www.w3.org/1999/xhtml" class="wrapper">
      <xhtml:style>
        * { box-sizing: border-box; }
        .wrapper { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
        button { appearance:none; -webkit-appearance:none; border:0; outline:0; box-shadow:none; width:100%; height:100%; margin:0; padding:0 14px; border-radius:6px; background:#f6f8fa; color:#25292e; display:inline-flex; align-items:center; justify-content:center; gap:8px; font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1; white-space:nowrap; cursor:pointer; transition:background-color .15s,color .15s; }
        button:hover { background:#eff2f5; color:#1f2328; }
        svg { width:17px; height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      </xhtml:style>
      <xhtml:button type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="19 11 12 14" aria-hidden="true" fill="none"><path d="M19 12.5 Q19 10.5 21 11.5 L29.5 17 Q31 18 29.5 19 L21 24.5 Q19 25.5 19 23.5 Z"/></svg>
        <xhtml:span style="display:flex;align-items:center;height:100%;line-height:1;">Play Ceedoku</xhtml:span>
      </xhtml:button>
    </xhtml:div>
  </foreignObject>
</svg>