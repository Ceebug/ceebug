        button { appearance:none; -webkit-appearance:none; border:0; outline:0; box-shadow:none; width:100%; height:100%; margin:0; padding:0 14px; border-radius:6px; background:#f6f8fa; color:#25292e; display:inline-flex; align-items:center; justify-content:center; gap:8px; font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1; white-space:nowrap; cursor:pointer; transition:background-color .15s,color .15s; }
