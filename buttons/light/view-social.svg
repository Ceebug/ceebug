<svg xmlns="http://www.w3.org/2000/svg" width="160" height="40" viewBox="0 0 160 40">
  <style>
    .background {
      fill: #ffffff;
      stroke: #d1d9e0;
      stroke-width: 1.5;
      transition: fill .15s, stroke .15s;
    }

    text {
      fill: #25292e;
      font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: fill .15s;
    }

    .icon {
      fill: none;
      stroke: #25292e;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .15s;
    }

    svg:hover .background {
      fill: #f3f4f6;
      stroke: #8c959f;
    }

    svg:hover text,
    svg:hover .icon {
      fill: #1f2328;
      stroke: #1f2328;
    }
  </style>

  <rect class="background" x=".75" y=".75" width="158.5" height="38.5" rx="6"/>

  <svg x="27" y="8" width="24" height="24" viewBox="0 0 24 24">
    <g class="icon">
      <path d="M14 6h4v4"/>
      <path d="M18 6l-8 8"/>
      <path d="M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
    </g>
  </svg>

  <text x="58" y="25">View social</text>
</svg>
