<svg xmlns="http://www.w3.org/2000/svg" width="150" height="36" viewBox="0 0 150 36">
  <style>
    rect {
      fill: #ffffff;
      stroke: #d1d9e0;
      transition: fill .15s, stroke .15s;
    }

    text {
      fill: #25292e;
      font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: fill .15s;
    }

    .icon {
      fill: none;
      stroke: #25292e;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .15s;
    }

    .dot {
      fill: #25292e;
      stroke: none;
      transition: fill .15s;
    }

    svg:hover rect {
      fill: #f3f4f6;
      stroke: #8c959f;
    }

    svg:hover text {
      fill: #1f2328;
    }

    svg:hover .icon {
      stroke: #1f2328;
    }

    svg:hover .dot {
      fill: #1f2328;
    }
  </style>

  <rect x=".75" y=".75" width="148.5" height="34.5" rx="6" stroke-width="1.5"/>

  <g>
    <circle class="icon" cx="37" cy="18" r="8"/>
    <path class="icon" d="M37 17v5"/>
    <circle class="dot" cx="37" cy="14" r="1"/>
  </g>

  <text x="52" y="22">Learn more</text>
</svg>
