<svg xmlns="http://www.w3.org/2000/svg"
     width="180" height="40" viewBox="0 0 180 40">

  <style>
    .button {
      fill: #21262d;
      stroke: #30363d;
      transition: fill 0.15s ease, stroke 0.15s ease;
    }

    .button-text {
      fill: #c9d1d9;
      font: 600 14px -apple-system, BlinkMacSystemFont,
            "Segoe UI", Helvetica, Arial, sans-serif;
    }

    a:hover .button {
      fill: #30363d;
      stroke: #8b949e;
    }

    a:hover .button-text {
      fill: #ffffff;
    }

    a:active .button {
      fill: #161b22;
    }
  </style>

  <!-- Change this URL -->
  <a href="https://github.com" target="_blank">
    <rect class="button" x="1" y="1"
          width="178" height="38" rx="6"/>

    <!-- Change this text -->
    <text class="button-text"
          x="90" y="25"
          text-anchor="middle">
      View on GitHub
    </text>
  </a>
</svg>
