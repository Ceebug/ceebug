<svg xmlns="http://w3.org" width="140" height="36" viewBox="0 0 140 36" fill="none">
  <style>
    .btn-bg {
      fill: #21262d;
      stroke: #30363d;
    }
    .btn-text {
      fill: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>

  <!-- Background Border and Fill -->
  <rect class="btn-bg" x="0.5" y="0.5" width="139" height="35" rx="6" stroke-width="1"/>

  <!-- Perfectly Centered Text -->
