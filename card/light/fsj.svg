<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="960" height="320" viewBox="0 0 960 320"><foreignObject width="960" height="320"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" class="root" style="width:100%;height:100%;container-type:inline-size;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#25292e;"><xhtml:style>
.root{box-sizing:border-box}.card{box-sizing:border-box;width:100%;padding:1.25cqw;border:.4cqw solid #d1d9e0;border-radius:2cqw;background:#ffffff;display:flex;flex-direction:column;align-items:stretch;gap:1cqw;font-size:4.5cqw;line-height:1.25;color:#25292e}.description{margin:0}.preview{display:block;width:100%;height:auto;max-width:100%;border-radius:calc(2cqw - 1.25cqw);margin:0}.made{margin:0;color:#57606a;font-size:.8em;line-height:1.2}.buttons{box-sizing:border-box;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:1cqw;margin-top:1.5cqw}.button{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:1cqw;min-height:12cqw;padding:2cqw 4cqw;border:.4cqw solid #d1d9e0;border-radius:2cqw;background:#ffffff;color:#25292e;font:600 4cqw/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-decoration:none;white-space:nowrap}.button svg{display:block;width:6cqw;height:6cqw;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.button:hover{background:#f3f4f6}
</xhtml:style><xhtml:div class="card"><xhtml:div class="description">A lightweight JavaScript serialiser for Ceedoku Save Format (.CSF) files. Takes data and creates a valid CSF save file.</xhtml:div><xhtml:div class="made"><xhtml:strong>Made with:</xhtml:strong> JavaScript</xhtml:div></xhtml:div><xhtml:div class="buttons"><xhtml:a class="button" href="https://github.com/Ceebug/FSJ"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="4" width="16" height="16" rx="2"/><path d="M9 9h8M9 13h8M9 17h4"/></svg><xhtml:span>View repository</xhtml:span></xhtml:a></xhtml:div></xhtml:div></foreignObject></svg>