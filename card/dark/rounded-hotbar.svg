<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="960" height="320" viewBox="0 0 960 320"><foreignObject width="960" height="320"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" class="root" style="width:100%;height:100%;container-type:inline-size;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#c9d1d9;"><xhtml:style>
