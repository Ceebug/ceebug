</xhtml:style><xhtml:div class="card"><xhtml:div class="description">A Minecraft resource pack that gives every hotbar slot rounded corners to match the off-hand slot, making the HUD more visually consistent.</xhtml:div><xhtml:div class="made"><xhtml:strong>Made with:</xhtml:strong> JSON · PNG</xhtml:div></xhtml:div><xhtml:div class="buttons"><xhtml:a class="button" href="https://modrinth.com/resourcepack/roundedhotbar"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2.5 22 7.5V18.5L13 23.5 4 18.5V7.5Z"/><path d="m4.5 7.8 8.5 4.8 8.5-4.8M13 12.6v10.2"/></svg><xhtml:span>View Modrinth page</xhtml:span></xhtml:a></xhtml:div></xhtml:div></foreignObject></svg>