<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="960" height="196" viewBox="0 0 960 196"><foreignObject width="960" height="196"><xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" class="root" style="width:100%;height:100%;container-type:inline-size;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e6edf3;"><xhtml:style>
.root{box-sizing:border-box}.card{box-sizing:border-box;width:100%;padding:1.25cqw;border:0;border-radius:2cqw;background:#172433;display:flex;flex-direction:column;align-items:stretch;gap:1cqw;font-size:4.5cqw;line-height:1.25;color:#e6edf3}.description{margin:0}.preview{display:block;width:100%;height:auto;max-width:100%;border-radius:calc(2cqw - 1.25cqw);margin:0}.made{margin:0;color:#9aa7b8;font-size:.8em;line-height:1.2}.buttons{box-sizing:border-box;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:1.5cqw;margin-top:1.5cqw;padding:0}.button{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:1cqw;min-height:8cqw;padding:1cqw 2cqw;border:0;border-radius:1.4cqw;background:#172433;background-clip:padding-box;color:#e6edf3;font:600 3.2cqw/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-decoration:none;white-space:nowrap;width:100%;min-width:0}.button svg{display:block;width:4cqw;height:4cqw;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.button:only-child{grid-column:1/-1}.button:hover{background:#26394d}
 .buttons{display:none}
</xhtml:style><xhtml:div class="card"><xhtml:div class="description">A Firefox style modification that makes the history buttons aligned properly on the toolbar.</xhtml:div><xhtml:div class="made"><xhtml:strong>Made with:</xhtml:strong> CSS</xhtml:div></xhtml:div><xhtml:div class="buttons"><xhtml:a class="button" href="https://github.com/Ceebug/nicetoolbar"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="4" width="16" height="16" rx="2"/><path d="M9 9h8M9 13h8M9 17h4"/></svg><xhtml:span>View repository</xhtml:span></xhtml:a></xhtml:div></xhtml:div></foreignObject></svg>